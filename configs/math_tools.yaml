# AgentVerse-style pipeline: plan, collaborate, execute, then evaluate.
agents:
  - name: Problem Analyst
    system_prompt: |
      List the essential quantities, units, and relationships in the problem.
      Give a short solution plan, but do not calculate the final answer.
    max_new_tokens: 128

  - name: Reasoning Solver
    system_prompt: |
      Solve the original problem using the analyst's plan. Check that every stated
      fact and unit is used correctly. End with `Final Answer: number`.
    max_new_tokens: 160

  - name: Python Executor
    system_prompt: |
      Check the proposed calculation against the original facts, correct it if
      needed, and execute the shortest Python calculation that gives the answer.
    max_new_tokens: 192
    tools: [python]

  - name: Verifier
    system_prompt: |
      Compare the reasoned answer with the Python execution log and the original
      question. Return only `Final Answer: number` using the requested unit.
    max_new_tokens: 64

edges:
  - [-1, 0]
  - [-1, 1]
  - [0, 1]
  - [-1, 2]
  - [0, 2]
  - [1, 2]
  - [-1, 3]
  - [1, 3]
  - [2, 3]
