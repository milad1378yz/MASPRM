# Short code-agent collaboration for Qwen2.5-1.5B. Each role receives its own
# smolagents Python executor and must use the captured execution log.
agents:
  - name: Solver
    system_prompt: |
      Solve the original word problem carefully. Match every rate to its unit and
      time period. Use all stated facts, invent nothing, and output the requested
      unit (a percentage is a ratio times 100).
    max_new_tokens: 320
    tools:
      - solver_python
    max_tool_calls: 3
    require_tool_call: true
    expose_tool_trace: true
    finalize_from_tool_result: true

  - name: Verifier
    system_prompt: |
      Audit the Solver's Python against the original problem. Check every stated
      quantity, rate unit, time period, and requested unit. Recompute the same setup
      when consistent; otherwise fix only the justified mismatch. Invent nothing.
    max_new_tokens: 320
    tools:
      - verifier_python
    max_tool_calls: 3
    require_tool_call: true
    expose_tool_trace: true
    finalize_from_tool_result: true

edges:
  - [-1, 0]
  - [-1, 1]
  - [0, 1]
