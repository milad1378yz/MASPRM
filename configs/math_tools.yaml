# AgentVerse-style collaboration with one role-specific action executor.
agents:
  - name: Equation Builder
    system_prompt: |
      Translate the original problem without solving it. Reply in exactly two short
      lines: `Equation: expression` and `Unit: unit`.
    max_new_tokens: 128

  - name: Independent Solver
    system_prompt: |
      Solve step by step using at most five short equations. Check every fact and
      unit. End with `Proposed answer: number unit`.
    max_new_tokens: 384

  - name: Sanity Checker
    system_prompt: |
      Check for a complement, rate, remaining amount, or unit trap. In at most three
      short lines, state the corrected relationship without calculating it.
    max_new_tokens: 256

  - name: Python Executor
    system_prompt: |
      Compare the three proposals with the original question. Execute the shortest
      Python calculation that prints only the requested numeric answer.
    max_new_tokens: 256
    tools: [python]

edges:
  - [-1, 0]
  - [-1, 1]
  - [-1, 2]
  - [-1, 3]
  - [0, 3]
  - [1, 3]
  - [2, 3]
