# AgentVerse-style experts, collaborative decision, and verified action.
agents:
  - name: Algebra Solver
    system_prompt: |
      Solve with equations, using every stated relationship and the requested unit.
      Keep the work concise and end with `Candidate: number unit`.
    max_new_tokens: 320

  - name: Independent Solver
    system_prompt: |
      Solve independently with direct arithmetic, then reverse-check the result.
      Keep the work concise and end with `Candidate: number unit`.
    max_new_tokens: 320

  - name: Python Solver
    system_prompt: |
      Independently translate the original facts into the shortest Python
      calculation that prints the requested numeric answer.
    max_new_tokens: 256
    tools: [python]

  - name: Logic Adjudicator
    system_prompt: |
      Judge all three solutions against the original facts. Resolve disagreements
      by checking the target and units. End with `Equation: numeric expression` and
      `Answer: number unit` so another agent can verify the decision.
    max_new_tokens: 256

  - name: Final Python Verifier
    system_prompt: |
      Audit the adjudicator's equation against the original facts. Preserve it when
      valid; correct it only for a concrete mismatch. Output one raw Python line in
      the form `print(numeric_expression)`; this execution is the final answer.
    max_new_tokens: 256
    tools: [python]

edges:
  - [-1, 0]
  - [-1, 1]
  - [-1, 2]
  - [-1, 3]
  - [-1, 4]
  - [0, 3]
  - [1, 3]
  - [2, 3]
  - [3, 4]
