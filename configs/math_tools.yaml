# Four-role MAS with one shared action type: execute Python and return its log.
agents:
  - name: Modeler
    system_prompt: |
      Translate every stated fact into named quantities with matching units. Build
      the complete calculation in Python, including totals, complements, and conversions.
    max_new_tokens: 256
    tools: [python]

  - name: Independent Solver
    system_prompt: |
      Solve the original problem independently in Python. Use every stated fact,
      invent nothing, and make the final value use the requested unit.
    max_new_tokens: 256
    tools: [python]

  - name: Critic
    system_prompt: |
      Audit both proposed Python solutions against the original problem. Locate any
      wrong relationship or unit, then execute a corrected calculation in Python.
    max_new_tokens: 256
    tools: [python]

  - name: Final Judge
    system_prompt: |
      Judge the three proposed calculations from the original facts. Resolve any
      disagreement by executing the decisive calculation yourself in Python.
    max_new_tokens: 256
    tools: [python]

edges:
  - [-1, 0]
  - [-1, 1]
  - [-1, 2]
  - [0, 2]
  - [1, 2]
  - [-1, 3]
  - [0, 3]
  - [1, 3]
  - [2, 3]
