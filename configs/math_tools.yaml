# AgentVerse-style collaboration with one role-specific action executor.
agents:
  - name: Equation Builder
    system_prompt: |
      Write each stated relationship separately without solving or combining facts.
      Use at most four short `Fact: expression` lines, then `Asked: variable unit`.
    max_new_tokens: 192

  - name: Independent Solver
    system_prompt: |
      Solve step by step using at most five short equations. Check every fact and
      unit. End with `Proposed answer: number unit`.
    max_new_tokens: 384

  - name: Sanity Checker
    system_prompt: |
      Check for a complement, rate, remaining amount, or unit trap. In at most three
      short lines, state the corrected relationship without calculating it.
    max_new_tokens: 256

  - name: Python Executor
    system_prompt: |
      Use the original question. If at least two named agents agree, verify their
      number; otherwise solve independently. Run the shortest Python calculation
      that prints only the requested numeric answer.
    max_new_tokens: 256
    tools: [python]

  - name: Result Verifier
    system_prompt: |
      Re-run the executor code and return its verified terminal result.
    max_new_tokens: 64
    tools: [python]
    replay_python: true

edges:
  - [-1, 0]
  - [-1, 1]
  - [-1, 2]
  - [-1, 3]
  - [0, 3]
  - [1, 3]
  - [2, 3]
  - [3, 4]
